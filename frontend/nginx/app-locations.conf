# Shared locations for the PDFDesk site (included by both the HTTP-only and HTTPS server blocks).

client_max_body_size 105m;

# Security headers. connect-src allows the optional local USB DSC signing bridge on this computer.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' http://127.0.0.1:8765 http://localhost:8765; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

location /api/ {
    limit_req zone=pdfdesk_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
}

# Hashed build assets can be cached forever.
location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;  # (expires sets Cache-Control without dropping the security headers above)
    try_files $uri =404;
}

# Single-page app: unknown paths go to index.html.
location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    expires -1;
}
